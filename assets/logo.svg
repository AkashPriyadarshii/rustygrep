<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="rustygrep logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#0d0a08"/>
    </linearGradient>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7b4f"/>
      <stop offset="1" stop-color="#ce422b"/>
    </linearGradient>
  </defs>
  <!-- rounded-square shell -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ff7b4f" stroke-opacity="0.22" stroke-width="6"/>
  <!-- rg = rustygrep -->
  <text x="256" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="224" font-weight="700" fill="url(#rg)" text-anchor="middle">rg</text>
  <!-- token-compression meter: bar shrinks -->
  <rect x="120" y="320" width="272" height="30" rx="15" fill="none" stroke="#2a2019" stroke-width="4"/>
  <rect x="124" y="324" width="150" height="22" rx="11" fill="#ff7b4f"/>
  <!-- arrow: input wide -> output narrow, compression signal -->
  <path d="M120 372 H392" stroke="#4a3a2e" stroke-width="5" stroke-linecap="round"/>
  <path d="M392 366 L388 378 M392 366 h0" stroke="#4a3a2e" stroke-width="5" stroke-linecap="round" opacity="0"/>
  <path d="M392 360 L408 372 L392 384" fill="none" stroke="#ff7b4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
